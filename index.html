<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LexiRef — a modern, offline reference manager and citation engine for Windows. APA, IEEE, MLA, Chicago, Harvard and Vancouver; BibTeX and RIS; retraction checks; one-click citations for Word.">
<meta name="theme-color" content="#4f46e5">
<meta name="color-scheme" content="light dark">
<title>LexiRef</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ---------- Design tokens ---------- */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --surface-2: #f7f8fb; --surface-3: #eceef4;
  --border: #e3e5ec; --border-strong: #cfd3de;
  --text: #1b1f2a; --text-2: #4b5160; --muted: #737a8c;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-soft: #eef0ff; --accent-text: #3730a3;
  --danger: #dc2626; --danger-soft: #fee2e2; --warn: #b45309; --warn-soft: #fef3c7; --ok: #047857; --ok-soft: #d1fae5;
  --radius: 10px; --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  --shadow-lg: 0 20px 50px rgba(16,24,40,.22), 0 2px 8px rgba(16,24,40,.12);
  --focus: 0 0 0 3px rgba(79,70,229,.25);
  --sidebar-w: 248px; --detail-w: 400px; --topbar-h: 56px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", Consolas, "SF Mono", monospace;
}
[data-theme="dark"] {
  --bg: #0f1117; --surface: #171a23; --surface-2: #1c1f2a; --surface-3: #242837;
  --border: #272b3a; --border-strong: #3a3f52;
  --text: #e7e9f0; --text-2: #b7bccb; --muted: #8b92a7;
  --accent: #6f6cf2; --accent-hover: #8886ff; --accent-soft: #262a4d; --accent-text: #c7c6ff;
  --danger: #f87171; --danger-soft: #3f1d1d; --warn: #fbbf24; --warn-soft: #3d2f0d; --ok: #34d399; --ok-soft: #0e3b2c;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 24px 60px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4);
  --focus: 0 0 0 3px rgba(135,132,245,.35);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: var(--accent-soft); }
*:focus-visible { outline: none; box-shadow: var(--focus); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
svg.ic { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.ic.lg { width: 20px; height: 20px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500; line-height: 1.2; white-space: nowrap; transition: background .12s, border-color .12s, transform .05s; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-3); border-color: transparent; }
.btn.sm { padding: 5px 9px; font-size: 13px; }
.btn.icon { padding: 7px; }
.btn[disabled] { opacity: .5; cursor: default; pointer-events: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--surface-3); color: var(--text-2); border: 1px solid transparent; cursor: pointer; }
.chip:hover { border-color: var(--border-strong); }
.chip.active { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.badge.retracted { background: var(--danger-soft); color: var(--danger); }
.badge.clean { background: var(--ok-soft); color: var(--ok); }
.badge.unknown { background: var(--warn-soft); color: var(--warn); }
.badge.type { background: var(--surface-3); color: var(--text-2); font-weight: 500; }
.badge.fav { background: var(--warn-soft); color: var(--warn); }

/* ---------- Forms ---------- */
input[type=text], input[type=number], input[type=search], input[type=url], input[type=date], select, textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); transition: border-color .12s, box-shadow .12s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: var(--focus); outline: none; }
textarea { resize: vertical; min-height: 70px; line-height: 1.45; }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.field { margin-bottom: 12px; }
.field .hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 14px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: auto; margin: 0; accent-color: var(--accent); }
.segmented { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.segmented button { border: 0; background: transparent; padding: 6px 11px; font-size: 13px; color: var(--text-2); }
.segmented button + button { border-left: 1px solid var(--border-strong); }
.segmented button.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }

/* ---------- Layout ---------- */
#app { display: flex; flex-direction: column; height: 100%; }
.topbar { height: var(--topbar-h); display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; padding-right: 6px; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; }
.search { flex: 1 1 auto; max-width: 560px; min-width: 150px; position: relative; }
.search input { padding-left: 34px; background: var(--surface-2); border-color: var(--border); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 5px; background: var(--surface); }
.topbar .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.topbar select { width: auto; padding: 6px 28px 6px 10px; }
.main { flex: 1 1 auto; display: flex; min-height: 0; }
.sidebar { width: var(--sidebar-w); flex: 0 0 auto; border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 10px 8px 20px; }
.sidebar h4 { margin: 14px 10px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
.sidebar h4 button { border: 0; background: transparent; color: var(--muted); padding: 2px; border-radius: 4px; display: inline-flex; }
.sidebar h4 button:hover { background: var(--surface-3); color: var(--text); }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-2); user-select: none; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.nav-item.active .count { color: var(--accent-text); }
.nav-item .name { flex: 1 1 auto; }
.nav-item.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px; }
.list-pane { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
.list-header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.list-header h2 { margin: 0; font-size: 15px; font-weight: 700; }
.list-header .count { color: var(--muted); font-weight: 500; font-size: 13px; }
.list-header .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.list-header select { width: auto; padding: 5px 26px 5px 9px; font-size: 13px; }
.bulkbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--accent-soft); color: var(--accent-text); border-bottom: 1px solid var(--border); font-size: 13px; }
.bulkbar .btn { background: var(--surface); }
.list { flex: 1 1 auto; overflow-y: auto; padding: 8px 12px 40px; }
.row { display: grid; grid-template-columns: 28px 34px 1fr 64px 132px; gap: 10px; align-items: center; padding: 9px 10px; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: default; margin-bottom: 2px; background: transparent; }
.row:hover { background: var(--surface); border-color: var(--border); }
.row.selected { background: var(--surface); border-color: var(--border-strong); box-shadow: var(--shadow); }
.row.active { background: var(--accent-soft); border-color: var(--accent); }
.row input[type=checkbox] { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
.row .ticon { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); }
.row.active .ticon { background: var(--surface); }
.row .t { font-weight: 600; line-height: 1.3; display: flex; gap: 6px; align-items: center; min-width: 0; }
.row .t span.txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.row .yr { font-variant-numeric: tabular-nums; color: var(--text-2); text-align: right; }
.row .meta { text-align: right; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.row .star { color: var(--warn); }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty h3 { color: var(--text); margin: 14px 0 6px; }
.empty .btn-row { justify-content: center; margin-top: 16px; }
.showmore { text-align: center; padding: 10px; }

/* ---------- Detail pane ---------- */
.detail { width: var(--detail-w); flex: 0 0 auto; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.detail .tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 10px; }
.detail .tabs button { border: 0; background: transparent; padding: 11px 12px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.detail .tabs button.active { color: var(--accent-text); border-bottom-color: var(--accent); }
.detail .body { flex: 1 1 auto; overflow-y: auto; padding: 16px 18px 30px; }
.detail .body h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.35; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; font-size: 13px; margin: 12px 0; }
.kv dt { color: var(--muted); min-width: 0; } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.detail .empty { padding: 40px 10px; }
.cite-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-family: Georgia, "Times New Roman", serif; font-size: 14px; line-height: 1.55; margin: 6px 0 8px; word-break: break-word; }
.cite-box.sm { font-size: 13px; }
.detail .section { margin-bottom: 18px; }
.detail .section > label.f, .detail .section h5 { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }
.warnbox { background: var(--danger-soft); color: var(--danger); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 13px; margin-bottom: 12px; display: flex; gap: 8px; align-items: flex-start; }
.okbox { background: var(--ok-soft); color: var(--ok); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; }
.infobox { background: var(--accent-soft); color: var(--accent-text); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 13px; margin-bottom: 12px; line-height: 1.45; }

/* ---------- Status bar ---------- */
.statusbar { height: 28px; display: flex; align-items: center; gap: 18px; padding: 0 14px; font-size: 12px; color: var(--muted); background: var(--surface); border-top: 1px solid var(--border); flex: 0 0 auto; }
.statusbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
.statusbar .dot.on { background: var(--ok); }
.statusbar .right { margin-left: auto; display: flex; gap: 14px; }

/* ---------- Modals ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10,12,20,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(2px); }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); width: min(680px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; border: 1px solid var(--border); animation: pop .14s ease-out; }
.modal.wide { width: min(900px, 100%); }
.modal.narrow { width: min(460px, 100%); }
@keyframes pop { from { transform: translateY(8px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
.modal header { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
.modal header h3 { margin: 0; font-size: 16px; flex: 1 1 auto; }
.modal header .x { border: 0; background: transparent; color: var(--muted); padding: 4px; border-radius: 6px; display: inline-flex; }
.modal header .x:hover { background: var(--surface-3); color: var(--text); }
.modal .content { padding: 16px 20px; overflow-y: auto; flex: 1 1 auto; }
.modal footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
.modal footer .spacer { flex: 1 1 auto; }
.preview { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; font-family: Georgia, "Times New Roman", serif; font-size: 14px; line-height: 1.6; max-height: 320px; overflow-y: auto; }
.preview p { margin: 0 0 8px; }
.result { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 8px; background: var(--surface); }
.result .r-title { font-weight: 600; } .result .r-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.result .btn { margin-left: auto; }
.progress { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; margin: 8px 0; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th, table.tbl td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; }
.dz { border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); background: var(--surface-2); }
.dz.over { border-color: var(--accent); background: var(--accent-soft); }
.menu { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 220px; animation: pop .12s ease-out; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; font-size: 13.5px; color: var(--text); }
.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 0; }
.menu .mlabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 6px 10px 2px; font-weight: 700; }
.menu button .sc { margin-left: auto; font-size: 11.5px; color: var(--muted); }
#toasts { position: fixed; bottom: 42px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; background: #1f2333; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); display: flex; gap: 14px; align-items: center; font-size: 13.5px; animation: pop .15s ease-out; max-width: 560px; }
.toast.err { background: #7f1d1d; } .toast.ok { background: #065f46; }
.toast button { border: 0; background: rgba(255,255,255,.14); color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: 600; }
.toast button:hover { background: rgba(255,255,255,.26); }
.kbdlist { columns: 2; gap: 24px; font-size: 13px; }
.kbdlist div { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); break-inside: avoid; }
kbd { font-family: var(--mono); font-size: 11.5px; background: var(--surface-3); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 16px; }
.stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.stat b { display: block; font-size: 20px; } .stat span { font-size: 12px; color: var(--muted); }
.welcome-opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 8px; }
.welcome-opts button { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 12px; padding: 16px 14px; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.welcome-opts button:hover { border-color: var(--accent); background: var(--accent-soft); }
.welcome-opts b { font-size: 14px; } .welcome-opts span { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.steps { counter-reset: s; padding-left: 0; list-style: none; }
.steps li { counter-increment: s; display: flex; gap: 12px; margin-bottom: 10px; line-height: 1.5; }
.steps li::before { content: counter(s); flex: 0 0 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; display: grid; place-items: center; font-size: 12px; }
@media (max-width: 1180px) { :root { --detail-w: 340px; } }
@media (max-width: 1100px) { .search .kbd { display: none; } .search input { padding-right: 10px; } }
@media (max-width: 1000px) { .topbar #styleSelect, .topbar #btnCheck { display: none; } }
@media (max-width: 980px) { .detail { position: fixed; right: 0; top: var(--topbar-h); bottom: 28px; box-shadow: var(--shadow-lg); z-index: 20; transform: translateX(100%); transition: transform .18s; } .detail.open { transform: none; } .row { grid-template-columns: 28px 34px 1fr 56px; } .row .meta { display: none; } }
@media (max-width: 760px) { .sidebar { display: none; } .topbar #btnBib span { display: none; } .grid2, .grid3 { grid-template-columns: 1fr; } .welcome-opts { grid-template-columns: 1fr; } .stat-grid { grid-template-columns: 1fr 1fr; } }
@media print { .topbar, .sidebar, .detail, .statusbar, .list-header { display: none !important; } .list { overflow: visible; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" title="LexiRef — reference manager & citation engine">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#lg)"/><g fill="#fff"><g transform="translate(24.25 27.5)"><circle r="7"/><path d="M6.86 1.4Q7 11.9-2.45 16.1Q2.1 10.5-1.4 6.86Z"/></g><g transform="translate(39.75 27.5)"><circle r="7"/><path d="M6.86 1.4Q7 11.9-2.45 16.1Q2.1 10.5-1.4 6.86Z"/></g></g></svg>
      <span>LexiRef</span>
    </div>
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchBox" type="search" placeholder="Search titles, authors, years, journals, DOIs, tags…" autocomplete="off" spellcheck="false">
      <span class="kbd">Ctrl+F</span>
    </div>

  var m = modal({ title: 'Add to collection', size: 'narrow', body: state.lib.collections.map(function (c) { return '<button class="btn" style="width:100%;justify-content:flex-start;margin-bottom:6px" data-cid="' + c.id + '">' + ic('folder') + esc(c.name) + '</button>'; }).join('') + '<button class="btn ghost" style="width:100%;justify-content:flex-start" id="newCollInline">' + ic('plus') + 'New collection…</button>', footer: false });
  $$('[data-cid]', m).forEach(function (b) { b.onclick = function () { addToCollection(ids, b.dataset.cid); m.close(); }; });
  $('#newCollInline', m).onclick = function () { m.close(); newCollection().then(function (c) { if (c) addToCollection(ids, c.id); }); };
}
function newCollection() {
  return promptDlg('New collection', 'Collection name', '', 'Create').then(function (name) {
    if (!name) return null;
    var c = { id: L.uid('c_'), name: name }; state.lib.collections.push(c); markDirty(); render(); return c;
  });
}
function collectionMenu(x, y, cid) {

  showMenu(x, y, [
    { label: 'Rename…', icon: 'edit', action: function () { promptDlg('Rename collection', 'Name', c.name, 'Rename').then(function (n) { if (n) { c.name = n; markDirty(); render(); } }); } },
    { label: 'Copy bibliography of this collection', icon: 'copy', action: function () { var its = state.lib.items.filter(function (it) { return (it.collections || []).indexOf(cid) >= 0; }); if (its.length) copyReferences(its); else toast('Collection is empty'); } },
    '-',
    { label: 'Delete collection', icon: 'trash', danger: true, action: function () { confirmDlg('Delete collection', 'Delete “' + esc(c.name) + '”? The references stay in your library.', 'Delete', true).then(function (ok) { if (!ok) return; state.lib.collections = state.lib.collections.filter(function (x) { return x.id !== cid; }); state.lib.items.forEach(function (it) { it.collections = (it.collections || []).filter(function (x) { return x !== cid; }); }); if (state.view.kind === 'collection' && state.view.id === cid) state.view = { kind: 'all', id: null }; markDirty(); render(); }); } }

}
function addTagTo(items) {
  promptDlg('Add tag', 'Tag (comma-separate several)', '', 'Add').then(function (v) {
    if (!v) return; var tags = v.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    items.forEach(function (it) { tags.forEach(function (t) { if ((it.tags || []).indexOf(t) < 0) it.tags = (it.tags || []).concat([t]); }); touch(it); });

}
function refreshFromDOI(it) {
  toast('Looking up DOI…');
  L.crossref.lookupDOI(it.doi).then(function (fresh) {
    ['title', 'authors', 'year', 'month', 'containerTitle', 'volume', 'issue', 'pages', 'publisher', 'place', 'issn', 'isbn', 'url', 'abstract'].forEach(function (k) { var v = fresh[k]; if ((Array.isArray(v) ? v.length : (v !== '' && v != null)) && (k !== 'abstract' || !it.abstract)) it[k] = v; });
    if (fresh.type !== 'other') it.type = fresh.type;
    if (fresh.retracted) { it.retracted = true; it.retractionNote = fresh.retractionNote; it.integrity = { status: 'retracted', checked: new Date().toISOString() }; }
    touch(it); render(); toast('Metadata refreshed from Crossref', { type: 'ok' });
  }).catch(function (e) { toast('Lookup failed: ' + (e.message || 'no connection'), { type: 'err' }); });
}

/* ---------- Editor ---------- */
function openEditor(id, preset) {
  var it = id ? JSON.parse(JSON.stringify(itemById(id))) : L.normalizeItem(preset || L.newItem('journalArticle'));
  var isNew = !id;
  var m = modal({ title: isNew ? 'Add reference' : 'Edit reference', size: 'wide', sticky: true, body: '<div class="grid3" style="align-items:end"><div class="field"><label class="f">Reference type</label><select id="eType">' + Object.keys(L.TYPES).map(function (k) { return '<option value="' + k + '">' + L.TYPES[k].label + '</option>'; }).join('') + '</select></div><div class="field" style="grid-column:span 2"><label class="f">Quick fill</label><div class="btn-row"><input type="text" id="eDoi" placeholder="Paste a DOI or arXiv ID to fill the form" style="flex:1"><button class="btn" id="eLookup">' + ic('search') + 'Look up</button></div></div></div><div id="eFields"></div>',
    footer: '<span class="muted small" id="ePreview" style="flex:1;font-family:Georgia,serif"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="eSave">' + (isNew ? 'Add to library' : 'Save changes') + '</button>' });
  var typeSel = $('#eType', m); typeSel.value = it.type;
  function readForm() {
    $$('[data-f]', m).forEach(function (el) {
      var k = el.dataset.f, v = el.value;
      if (k === 'authors' || k === 'editors') it[k] = L.parseNames(v);
      else if (k === 'tags') it.tags = v.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      else if (k === 'collections') it.collections = $$('input[data-coll]:checked', m).map(function (c) { return c.dataset.coll; });
      else it[k] = v.trim();
    });
    it.collections = $$('input[data-coll]:checked', m).map(function (c) { return c.dataset.coll; });
    it.favorite = $('#eFav', m).checked; it.retracted = $('#eRet', m).checked;
    it.type = typeSel.value;
  }
  function renderFields() {
    var defs = L.TYPE_FIELDS[it.type] || L.TYPE_FIELDS.other, h = '<div class="grid2">';
    defs.forEach(function (d) {
      var parts = d.split(':'), k = parts[0], label = parts[1] || L.FIELDS[k].label, f = L.FIELDS[k], v = it[k];
      var full = k === 'title' || k === 'abstract' || k === 'authors' || k === 'editors' || k === 'url' || k === 'tags' || k === 'attachment';
      h += '<div class="field" ' + (full ? 'style="grid-column:span 2"' : '') + '><label class="f">' + esc(label) + (k === 'title' ? ' <span style="color:var(--danger)">*</span>' : '') + '</label>';
      if (f.kind === 'names') h += '<textarea data-f="' + k + '" rows="' + (k === 'authors' ? 3 : 2) + '" placeholder="One per line: Family, Given   —   or   Given Family\n{Organization Name} for institutional authors" spellcheck="false">' + esc(L.namesToText(v || [])) + '</textarea>';
      else if (f.kind === 'textarea') h += '<textarea data-f="' + k + '" rows="3">' + esc(v || '') + '</textarea>';
      else if (f.kind === 'month') h += '<select data-f="' + k + '"><option value="">—</option>' + L.MONTHS.map(function (mo, i) { return '<option value="' + (i + 1) + '" ' + (String(v) === String(i + 1) ? 'selected' : '') + '>' + mo + '</option>'; }).join('') + '</select>';
      else if (f.kind === 'tags') h += '<input type="text" data-f="tags" value="' + esc((v || []).join(', ')) + '" placeholder="e.g. review, to-read, chapter 2">';
      else if (f.kind === 'date') h += '<input type="date" data-f="' + k + '" value="' + esc(v || '') + '">';
      else h += '<input type="' + (f.kind === 'number' ? 'text' : f.kind === 'url' ? 'url' : 'text') + '" data-f="' + k + '" value="' + esc(v == null ? '' : v) + '" ' + (k === 'doi' ? 'placeholder="10.1000/xyz123" spellcheck="false"' : k === 'pages' ? 'placeholder="e.g. 218–236"' : '') + '>';
      if (k === 'authors') h += '<div class="hint">Use braces for organisations, e.g. <code>{World Health Organization}</code>. Hyphenated given names and particles (van, de, al) are handled automatically.</div>';
      h += '</div>';

    h += '</div>';
    h += '<div class="grid2"><div class="field"><label class="f">Collections</label><div style="display:flex;flex-wrap:wrap;gap:6px">' + (state.lib.collections.length ? state.lib.collections.map(function (c) { return '<label class="check chip"><input type="checkbox" data-coll="' + c.id + '" ' + ((it.collections || []).indexOf(c.id) >= 0 ? 'checked' : '') + '>' + esc(c.name) + '</label>'; }).join('') : '<span class="muted small">No collections yet</span>') + '</div></div><div class="field"><label class="f">Flags</label><div style="display:flex;gap:16px;flex-wrap:wrap;padding-top:6px"><label class="check"><input type="checkbox" id="eFav" ' + (it.favorite ? 'checked' : '') + '>Favorite</label><label class="check"><input type="checkbox" id="eRet" ' + (it.retracted ? 'checked' : '') + '>Retracted / flagged</label></div></div></div>';

      it = L.normalizeItem(fresh); for (var k in keep) it[k] = keep[k]; if (!it.tags.length && fresh.tags) it.tags = fresh.tags;

  };
  $('#eSave', m).onclick = function () {
    readForm();

    if (isNew) { if (state.view.kind === 'collection' && it.collections.indexOf(state.view.id) < 0) it.collections.push(state.view.id); state.lib.items.unshift(it); state.active = it.id; }
    else { var idx = state.lib.items.findIndex(function (x) { return x.id === it.id; }); if (idx >= 0) state.lib.items[idx] = it; }

/* ---------- Lookup (DOI / arXiv / title search) ---------- */
function openLookup() {
  var m = modal({ title: 'Add by DOI, arXiv ID or title', body: '<div class="field"><div class="btn-row"><input type="text" id="lkQuery" placeholder="10.1016/j.eneco.2013.02.004  ·  arXiv:2010.11929  ·  or title keywords" style="flex:1" spellcheck="false"><button class="btn primary" id="lkGo">' + ic('search') + 'Search</button></div><div class="hint">Metadata comes from Crossref (free, public). Requires an internet connection; everything else in LexiRef works offline.</div></div><div id="lkResults"></div>', footer: '<span class="spacer"></span><button class="btn" data-close>Close</button>' });
  var inp = $('#lkQuery', m), res = $('#lkResults', m);
  function go() {
    var q = inp.value.trim(); if (!q) return;
    res.innerHTML = '<div class="muted" style="padding:14px 0">Searching…</div>';
    var doi = q.match(/10\.\d{4,9}\/[^\s"<>]+/), arx = q.match(/(?:arxiv:)?\s*(\d{4}\.\d{4,5}(?:v\d+)?)/i);
    var p = doi ? L.crossref.lookupDOI(doi[0]).then(function (x) { return [x]; }) : (arx && !/\s/.test(q) ? L.crossref.arxiv(arx[1]).then(function (x) { return [x]; }) : L.crossref.search(q, 12));
    p.then(function (items) {
      if (!items.length) { res.innerHTML = '<div class="muted" style="padding:14px 0">No results.</div>'; return; }
      res.innerHTML = items.map(function (it, i) { var dup = state.lib.items.some(function (x) { return it.doi && x.doi && x.doi.toLowerCase() === it.doi.toLowerCase(); }); return '<div class="result"><div class="ticon" style="width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);flex:0 0 auto">' + ic(L.TYPES[it.type].icon) + '</div><div style="min-width:0;flex:1"><div class="r-title">' + esc(it.title) + (it.retracted ? ' <span class="badge retracted">Retracted</span>' : '') + '</div><div class="r-sub">' + esc(authorsLine(it)) + (it.year ? ' (' + it.year + ')' : '') + (sourceLine(it) ? ' · ' + esc(sourceLine(it)) : '') + (it.doi ? ' · ' + esc(it.doi) : '') + '</div><div class="r-sub" style="font-family:Georgia,serif;margin-top:5px">' + L.formatReference(it, state.settings.style).html + '</div></div><button class="btn sm ' + (dup ? '' : 'primary') + '" data-i="' + i + '">' + (dup ? 'In library' : 'Add') + '</button></div>'; }).join('');
      $$('button[data-i]', res).forEach(function (b) { b.onclick = function () { var it = items[+b.dataset.i]; if (state.view.kind === 'collection') it.collections = [state.view.id]; state.lib.items.unshift(it); state.active = it.id; markDirty(); render(); b.textContent = 'Added ✓'; b.classList.remove('primary'); b.disabled = true; toast('Added: ' + it.title, { type: 'ok' }); }; });
    }).catch(function (e) { res.innerHTML = '<div class="warnbox">' + ic('warn') + '<div>Lookup failed (' + esc(e.message || 'no connection') + '). Check the identifier and your internet connection.</div></div>'; });
  }
  $('#lkGo', m).onclick = go; inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
}

/* ---------- Import ---------- */
function openImport(file) {
  var m = modal({ title: 'Import references', size: 'wide', body: '<div class="dz" id="dz">' + ic('import', 'lg') + '<div style="margin-top:6px"><b>Drop a file here</b> or <a href="#" id="dzPick">choose a file</a></div><div class="small" style="margin-top:4px">BibTeX (.bib) · RIS (.ris) · CSL-JSON / Zotero JSON · LexiRef library (.json)</div></div><div class="field" style="margin-top:12px"><label class="f">…or paste BibTeX / RIS / JSON / a list of DOIs</label><textarea id="impText" rows="5" spellcheck="false" placeholder="@article{key, title={...}, author={...}, year={2024}}"></textarea></div><div class="btn-row"><button class="btn" id="impParse">' + ic('check') + 'Preview</button><span class="muted small" id="impInfo"></span></div><div id="impList" style="margin-top:12px"></div>',
    footer: '<label class="check small"><input type="checkbox" id="impSkipDup" checked>Skip references whose DOI or title is already in the library</label><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="impGo" disabled>Import</button>' });
  var parsed = [], dz = $('#dz', m);
  function handleFile(f) {
    var r = new FileReader();
    r.onload = function () {
      var txt = String(r.result);
      try {
        if (/\.json$|\.lexiref$/i.test(f.name) || /^\s*[\[{]/.test(txt)) { var lib = L.libraryFile.parse(txt); parsed = lib.items; if (lib.collections.length) parsed._collections = lib.collections; }
        else parsed = L.importAny(txt, f.name);
      } catch (e) { parsed = []; toast('Could not parse ' + f.name + ': ' + e.message, { type: 'err' }); }
      show(f.name);
    };
    r.readAsText(f);
  }
  function show(src) {
    var dois = parsed.filter(function (p) { return /^\(DOI pending lookup\)/.test(p.title); });
    $('#impInfo', m).textContent = parsed.length ? parsed.length + ' references found' + (src ? ' in ' + src : '') + (dois.length ? ' (' + dois.length + ' DOIs will be looked up online)' : '') : 'Nothing recognised';
    $('#impGo', m).disabled = !parsed.length; $('#impGo', m).textContent = 'Import ' + (parsed.length || '');
    $('#impList', m).innerHTML = parsed.slice(0, 50).map(function (it) { return '<div class="result" style="padding:7px 10px"><div style="min-width:0"><div class="r-title ellipsis">' + esc(it.title) + '</div><div class="r-sub">' + esc(authorsLine(it)) + (it.year ? ' (' + it.year + ')' : '') + ' · ' + esc(L.TYPES[it.type].label) + '</div></div></div>'; }).join('') + (parsed.length > 50 ? '<div class="muted small">…and ' + (parsed.length - 50) + ' more</div>' : '');
  }
  $('#dzPick', m).onclick = function (e) { e.preventDefault(); var fi = $('#fileInput'); fi.value = ''; fi.onchange = function () { if (fi.files[0]) handleFile(fi.files[0]); }; fi.click(); };
  dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', function () { dz.classList.remove('over'); });
  dz.addEventListener('drop', function (e) { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  $('#impParse', m).onclick = function () { var t = $('#impText', m).value; try { parsed = /^\s*[\[{]/.test(t) ? L.libraryFile.parse(t).items : L.importAny(t); } catch (e) { parsed = []; toast('Could not parse: ' + e.message, { type: 'err' }); } show(''); };
  $('#impGo', m).onclick = function () {
    var skip = $('#impSkipDup', m).checked, added = 0, skipped = 0, pending = [];
    var doiSet = {}, titleSet = {};
    state.lib.items.forEach(function (x) { if (x.doi) doiSet[x.doi.toLowerCase()] = 1; titleSet[(x.title || '').toLowerCase().replace(/\W+/g, ' ').trim()] = 1; });
    if (parsed._collections) parsed._collections.forEach(function (c) { if (!collById(c.id) && !state.lib.collections.some(function (x) { return x.name === c.name; })) state.lib.collections.push(c); });
    parsed.forEach(function (it) {
      it = L.normalizeItem(it); it.id = itemById(it.id) ? L.uid('r_') : it.id;
      if (skip && ((it.doi && doiSet[it.doi.toLowerCase()]) || (it.title && titleSet[it.title.toLowerCase().replace(/\W+/g, ' ').trim()] && !/^\(DOI pending/.test(it.title)))) { skipped++; return; }
      if (state.view.kind === 'collection' && it.collections.indexOf(state.view.id) < 0) it.collections.push(state.view.id);
      it.collections = it.collections.filter(function (c) { return collById(c); });
      it.added = new Date().toISOString();
      if (/^\(DOI pending lookup\)/.test(it.title)) pending.push(it);
      state.lib.items.unshift(it); added++;
      if (it.doi) doiSet[it.doi.toLowerCase()] = 1;
    });
    markDirty(); m.close(); render();
    toast('Imported ' + added + (skipped ? ', skipped ' + skipped + ' duplicates' : ''), { type: 'ok' });
    if (pending.length) resolvePending(pending);
  };
  if (file) handleFile(file);
}
function resolvePending(items) {
  var done = 0;
  toast('Looking up ' + items.length + ' DOIs…');
  (function next() {
    if (done >= items.length) { render(); toast('DOI lookups finished', { type: 'ok' }); return; }
    var it = items[done++];
    L.crossref.lookupDOI(it.doi).then(function (fresh) { for (var k in fresh) if (k !== 'id' && k !== 'added' && k !== 'collections' && k !== 'tags') it[k] = fresh[k]; it.modified = new Date().toISOString(); markDirty(); })
      .catch(function () { it.title = 'DOI not found: ' + it.doi; }).then(function () { setTimeout(next, 150); });
  })();
}

/* ---------- Export & bibliography ---------- */
function exportItems(items, fmt, heading) {
  var style = state.settings.style, numeric = L.STYLES[style].numeric;
  var bib = L.bibliography(items, style, { markRetracted: state.settings.markRetracted });
  var base = 'LexiRef-' + (heading || 'references').replace(/[^\w\-]+/g, '-').toLowerCase();
  switch (fmt) {
    case 'docx': return download(base + '-' + style + '.docx', L.exportDocx(bib.entries, { heading: heading, numeric: numeric }));
    case 'rtf': return download(base + '-' + style + '.rtf', L.exportRtf(bib.entries, { heading: heading, numeric: numeric }), 'application/rtf');
    case 'html': return download(base + '-' + style + '.html', L.exportHtml(bib.entries, { heading: heading, numeric: numeric }), 'text/html');
    case 'txt': return download(base + '-' + style + '.txt', bib.text, 'text/plain');
    case 'bib': return download(base + '.bib', L.bibtex.serialize(items), 'application/x-bibtex');
    case 'ris': return download(base + '.ris', L.ris.serialize(items), 'application/x-research-info-systems');
    case 'csl': return download(base + '.csl.json', L.csl.serialize(items), 'application/json');
    case 'lexiref': return download(base + '.lexiref.json', L.libraryFile.serialize({ collections: state.lib.collections.filter(function (c) { return items.some(function (it) { return (it.collections || []).indexOf(c.id) >= 0; }); }), items: items }), 'application/json');
  }
}
function openBibliography(preset) {
  var sel = selectedItems(), view = listed();
  var scope = preset || (sel.length ? 'selected' : 'view');
  var m = modal({ title: 'Bibliography & export', size: 'wide', body:
    '<div class="grid3"><div class="field"><label class="f">References</label><select id="bScope"><option value="selected" ' + (!sel.length ? 'disabled' : '') + '>Selected (' + sel.length + ')</option><option value="view">Current view: ' + esc(viewTitle()) + ' (' + view.length + ')</option><option value="all">Whole library (' + state.lib.items.length + ')</option></select></div><div class="field"><label class="f">Style</label><select id="bStyle">' + Object.keys(L.STYLES).map(function (k) { return '<option value="' + k + '" ' + (k === state.settings.style ? 'selected' : '') + '>' + L.STYLES[k].label + '</option>'; }).join('') + '</select></div><div class="field"><label class="f">Heading</label><input type="text" id="bHeading" value="References"></div></div>' +
    '<div class="btn-row" style="margin-bottom:10px"><label class="check small"><input type="checkbox" id="bMark" ' + (state.settings.markRetracted ? 'checked' : '') + '>Prefix retracted sources with “RETRACTED:”</label><span class="muted small" id="bInfo" style="margin-left:auto"></span></div>' +
    '<div class="preview" id="bPreview"></div>' +
    '<div style="margin-top:14px"><label class="f">Formatted bibliography</label><div class="btn-row"><button class="btn primary" data-x="copy">' + ic('copy') + 'Copy for Word (rich text)</button><button class="btn" data-x="copytxt">Copy plain text</button><button class="btn" data-x="docx">' + ic('word') + 'Word (.docx)</button><button class="btn" data-x="rtf">RTF</button><button class="btn" data-x="html">HTML</button><button class="btn" data-x="txt">Text</button></div></div>' +
    '<div style="margin-top:12px"><label class="f">Reference data (for other tools)</label><div class="btn-row"><button class="btn" data-x="bib">BibTeX (.bib)</button><button class="btn" data-x="ris">RIS (.ris)</button><button class="btn" data-x="csl">CSL-JSON (Zotero / Pandoc)</button><button class="btn" data-x="lexiref">LexiRef library file (.json)</button></div></div>',
    footer: '<span class="muted small">Author–date styles are sorted alphabetically; IEEE and Vancouver keep the list order and number entries.</span><span class="spacer"></span><button class="btn" data-close>Close</button>' });
  $('#bScope', m).value = scope;
  function items() { var s = $('#bScope', m).value; return s === 'selected' ? selectedItems() : s === 'view' ? listed() : state.lib.items.slice(); }
  function refresh() {

/* ---------- Integrity check ---------- */
function openIntegrity() {
  var sel = selectedItems(), pool = sel.length ? sel : listed();
  var withDoi = pool.filter(function (it) { return it.doi; }), noDoi = pool.length - withDoi.length;
  var m = modal({ title: 'Reference integrity check', body: '<p style="margin:0 0 10px;line-height:1.5">Checks each reference with a DOI against <b>Crossref</b> (publisher retraction notices) and <b>OpenAlex</b> (Retraction Watch data). Retracted or withdrawn papers are flagged so you never cite one by accident.</p><div class="infobox">' + withDoi.length + ' of ' + pool.length + ' ' + (sel.length ? 'selected' : 'listed') + ' references have a DOI' + (noDoi ? ' · ' + noDoi + ' without DOI cannot be checked automatically' : '') + '. Requires an internet connection.</div><div class="progress"><div id="ckBar"></div></div><div id="ckStatus" class="muted small"></div><div id="ckResults" style="margin-top:10px"></div>',
    footer: '<span class="spacer"></span><button class="btn" data-close>Close</button><button class="btn primary" id="ckGo" ' + (withDoi.length ? '' : 'disabled') + '>Check ' + withDoi.length + ' references</button>' });
  $('#ckGo', m).onclick = function () {
    var btn = this; btn.disabled = true; var i = 0, flagged = [], unknown = 0, rows = '';
    (function next() {
      if (i >= withDoi.length) {
        $('#ckStatus', m).innerHTML = '<b>Done.</b> ' + flagged.length + ' flagged, ' + (withDoi.length - flagged.length - unknown) + ' clean' + (unknown ? ', ' + unknown + ' could not be verified' : '') + '.';
        btn.textContent = 'Finished'; markDirty(); render(); return;
      }
      var it = withDoi[i++];
      $('#ckBar', m).style.width = Math.round(i / withDoi.length * 100) + '%';
      $('#ckStatus', m).textContent = 'Checking ' + i + ' / ' + withDoi.length + ': ' + it.title;
      L.integrity.check(it).then(function (r) {
        it.integrity = { status: r.status, checked: new Date().toISOString(), note: r.note, auto: true };
        if (r.status === 'retracted') { it.retracted = true; it.retractionNote = r.note; flagged.push(it); }
        else if (r.status === 'clean' && it.retracted && it.retractionNote !== 'Marked manually' && it.integrity.auto) { /* keep manual flags, clear auto ones */ if (/Crossref|OpenAlex/.test(it.retractionNote || '')) { it.retracted = false; it.retractionNote = ''; } }
        else if (r.status === 'unknown') unknown++;
        rows += '<tr><td><span class="badge ' + r.status + '">' + (r.status === 'retracted' ? 'RETRACTED' : r.status === 'clean' ? 'Clean' : 'Unknown') + '</span></td><td>' + esc(it.title) + '<div class="muted small">' + esc(r.note) + '</div></td></tr>';
        $('#ckResults', m).innerHTML = '<table class="tbl"><tr><th style="width:90px">Status</th><th>Reference</th></tr>' + rows + '</table>';
        setTimeout(next, 120);
      });
    })();
  };
}

function openDuplicates() {
  var groups = L.findDuplicates(state.lib.items);
  if (!groups.length) { toast('No duplicates found — library is clean', { type: 'ok' }); return; }
  var m = modal({ title: 'Possible duplicates (' + groups.length + ')', size: 'wide', body: groups.map(function (g, gi) { return '<div class="result" style="flex-direction:column;align-items:stretch"><div class="small muted" style="margin-bottom:6px">Group ' + (gi + 1) + ' — choose the record to keep; the others will be merged into it (tags, collections and notes are combined).</div>' + g.map(function (it, ii) { return '<label class="check" style="padding:4px 0"><input type="radio" name="g' + gi + '" value="' + it.id + '" ' + (ii === 0 ? 'checked' : '') + '><span><b>' + esc(it.title) + '</b><span class="muted small"> — ' + esc(authorsLine(it)) + ' (' + (it.year || '—') + ') · ' + esc(L.TYPES[it.type].label) + (it.doi ? ' · ' + esc(it.doi) : '') + ' · added ' + esc(fmtDate(it.added)) + '</span></span></label>'; }).join('') + '</div>'; }).join(''),
    footer: '<span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="dupMerge">Merge all groups</button>' });
  $('#dupMerge', m).onclick = function () {
    var removed = 0;
    groups.forEach(function (g, gi) {
      var keepId = ($('input[name=g' + gi + ']:checked', m) || {}).value, keep = itemById(keepId); if (!keep) return;
      g.forEach(function (it) {
        if (it.id === keepId) return;
        (it.tags || []).forEach(function (t) { if (keep.tags.indexOf(t) < 0) keep.tags.push(t); });
        (it.collections || []).forEach(function (c) { if (keep.collections.indexOf(c) < 0) keep.collections.push(c); });
        if (it.notes && keep.notes.indexOf(it.notes) < 0) keep.notes = (keep.notes ? keep.notes + '\n\n' : '') + it.notes;
        ['abstract', 'doi', 'url', 'pages', 'volume', 'issue', 'publisher'].forEach(function (k) { if (!keep[k] && it[k]) keep[k] = it[k]; });
        keep.favorite = keep.favorite || it.favorite;
        state.lib.items = state.lib.items.filter(function (x) { return x.id !== it.id; }); removed++;
      });
      touch(keep);
    });

  };
}

var fileWriteTimer = null;

    state.fileHandle = h; state.filePermission = 'granted'; DB.set('fileHandle', h); writeLinkedFile(true); renderStatus();

  $('#sortSelect').onchange = function () { state.sort = this.value; renderList(); };
  var st; $('#searchBox').addEventListener('input', function () { clearTimeout(st); var v = this.value; st = setTimeout(function () { state.query = v; state.limit = 300; renderList(); }, 120); });
  $$('.detail .tabs button[data-tab]').forEach(function (b) { b.onclick = function () { state.tab = b.dataset.tab; renderDetail(); }; });
  $$('#bulkbar [data-bulk]').forEach(function (b) { b.onclick = function () { bulk(b.dataset.bulk); }; });
  // Drag & drop files anywhere → import
  document.addEventListener('dragover', function (e) { if (e.dataTransfer && e.dataTransfer.types.indexOf('Files') >= 0) e.preventDefault(); });
  document.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0] && !$('.overlay')) { e.preventDefault(); openImport(e.dataTransfer.files[0]); } });
  // Keyboard
  document.addEventListener('keydown', function (e) {
    var inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;
    var mod = e.ctrlKey || e.metaKey, hasModal = !!$('.overlay');
    if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); $('#searchBox').focus(); $('#searchBox').select(); return; }
    if (hasModal) return;
    if (mod && e.key.toLowerCase() === 'n') { e.preventDefault(); openEditor(null); return; }
    if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); openLookup(); return; }
    if (mod && e.key.toLowerCase() === 'i') { e.preventDefault(); openImport(); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'e') { e.preventDefault(); openBibliography(); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'c') { e.preventDefault(); var t1 = targetItems(); if (t1.length) copyCitation(t1); return; }
    if (mod && e.shiftKey && e.key.toLowerCase() === 'b') { e.preventDefault(); var t2 = targetItems(); if (t2.length) copyReferences(t2); return; }
    if (inField) { if (e.key === 'Escape') { document.activeElement.blur(); if (document.activeElement === $('#searchBox')) { } } return; }
    if (mod && e.key.toLowerCase() === 'e') { e.preventDefault(); if (state.active) openEditor(state.active); return; }
    if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); listed().forEach(function (i) { state.selected[i.id] = true; }); renderList(); return; }
    if (e.key === 'Delete') { var t3 = targetItems(); if (t3.length) { if (t3.length > 1) bulk('delete'); else deleteItems(t3); } return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); return; }
    if (e.key === 'Enter' && state.active) { openEditor(state.active); return; }
    if (e.key === 'Escape') { state.selected = {}; renderList(); }
  });
}

/* ---------- Init ---------- */
function init() {
  Promise.all([DB.get('library'), DB.get('settings'), DB.get('fileHandle')]).then(function (r) {
    if (r[0] && r[0].items) state.lib = { collections: r[0].collections || [], items: r[0].items.map(L.normalizeItem) };
    if (r[1]) for (var k in r[1]) state.settings[k] = r[1][k];
    L.setContactEmail(state.settings.contactEmail || '');
    if (r[2]) { state.fileHandle = r[2]; state.filePermission = 'prompt'; if (r[2].queryPermission) r[2].queryPermission({ mode: 'readwrite' }).then(function (p) { state.filePermission = p; renderStatus(); }).catch(function () {}); }
    applyTheme(); bindUI(); render();
    var launched = handleLaunch();
    if (!launched && !state.settings.welcomed && !state.lib.items.length) openWelcome();
  }).catch(function () { applyTheme(); bindUI(); render(); });
}
function handleLaunch() {
  var a = null; try { a = new URLSearchParams(location.search).get('action'); } catch (e) {}
  if ('launchQueue' in window && window.launchQueue.setConsumer) {
    window.launchQueue.setConsumer(function (lp) { if (lp.files && lp.files.length) lp.files[0].getFile().then(function (f) { openImport(f); }); });
  }
  if (a === 'lookup') { openLookup(); return true; }
  if (a === 'import') { openImport(); return true; }
  if (a === 'bibliography') { openBibliography(); return true; }
  return a === 'open';
}
init();
if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
})();
</script>
